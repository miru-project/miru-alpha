name: widgetbook_workspace
description: "Miru component catalog (Widgetbook workspace app)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.25.0
  forui: ^0.27.2
  # The app's material re-export (flutter/material is deprecated in this
  # project) — declared directly because use-case files import it.
  material_ui: any
  # Declared for the mirrored use-cases (screens under Riverpod/GoRouter);
  # versions resolve through miru_alpha's own constraints.
  hooks_riverpod: any
  flutter_hooks: any
  go_router: any
  easy_refresh: any
  miru_alpha:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
