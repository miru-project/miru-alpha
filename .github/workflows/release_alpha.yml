name: Alpha Release

on:
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

concurrency:
  group: alpha-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.7"
  GO_VERSION: "1.27.3"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      already_released: ${{ steps.prep.outputs.already_released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # One call runs the whole flow: regenerate CHANGELOG.md (git-cliff),
      # set pubspec from the tag, commit "chore(release): <tag> [skip ci]",
      # move the tag onto that commit and push it. If the tag already points
      # at a release commit (the re-created tag re-fired this workflow), it
      # exits as a no-op and every later job is skipped.
      - name: Prepare release (changelog, pubspec, commit, retag, push)
        id: prep
        run: >
          bash tool/release_prepare.sh --push
          --body-file release_body.md
          --output "$GITHUB_OUTPUT"

      - name: Show release message
        if: steps.prep.outputs.already_released != 'true'
        run: cat release_body.md

      - name: Create release
        if: steps.prep.outputs.already_released != 'true'
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release_body.md
          allowUpdates: true
          prerelease: true

  build-and-release-android:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Set pubspec version from tag
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Decode keystore
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get

      # Android versionCode: invisible monotonic integer derived from git
      # history, never part of the version string (tags carry no +N).
      # +100000 keeps it above the legacy +100002-era versionCodes.
      - name: Derive Android versionCode
        id: vcode
        run: echo "code=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_OUTPUT"

      - name: Collect Apks
        run: flutter build apk --release --split-per-abi --build-number=${{ steps.vcode.outputs.code }} --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk"
          allowUpdates: true
          prerelease: true

  build-and-release-windows:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Set pubspec version from tag
        shell: bash
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{env.GO_VERSION}}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build artifacts
        run: flutter build windows --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Rename Release Directory Name to Miru-alpha
        run: |
          mv build/windows/x64/runner/Release build/windows/x64/runner/Miru-alpha

      - name: Zip Release
        run: Compress-Archive -Path build/windows/x64/runner/Miru-alpha -DestinationPath Miru-Alpha-windows.zip

      - name: Upload zip to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Miru-Alpha-windows.zip"
          allowUpdates: true
          prerelease: true

  build-and-release-linux:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Set pubspec version from tag
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{env.GO_VERSION}}"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential jq libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build artifacts
        run: flutter build linux --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Rename Release Directory Name to Miru-alpha
        run: mv build/linux/x64/release/bundle build/linux/x64/release/Miru-alpha

      - name: Tar Release
        run: tar -czvf Miru-Alpha-linux.tar.gz -C build/linux/x64/release Miru-alpha

      - name: Upload tar.gz to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Miru-Alpha-linux.tar.gz"
          allowUpdates: true
          prerelease: true
