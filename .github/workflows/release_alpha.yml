name: Alpha Release

on:
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"
  GO_VERSION: "1.27.0"

jobs:
  # Tag is the single source of truth:
  #   tag upload -> set pubspec -> gen msg -> create release
  # Build jobs then attach their artifacts to that release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed to diff for release notes

      - name: Set pubspec version from tag
        id: set
        run: |
          bash tool/pubspec_from_tag.sh
          echo "version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Generate release message
        run: bash tool/release_body.sh > release_body.md

      - name: Show release message
        run: cat release_body.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release_body.md
          allowUpdates: true
          prerelease: true

  build-and-release-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Set pubspec version from tag
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Decode keystore
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get

      - name: Collect Apks
        run: flutter build apk --release --split-per-abi --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,build/app/outputs/flutter-apk/app-x86_64-release.apk"
          allowUpdates: true
          prerelease: true

  build-and-release-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set pubspec version from tag
        shell: bash
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{env.GO_VERSION}}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build artifacts
        run: flutter build windows --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Rename Release Directory Name to Miru-alpha
        run: |
          mv build/windows/x64/runner/Release build/windows/x64/runner/Miru-alpha

      - name: Zip Release
        run: Compress-Archive -Path build/windows/x64/runner/Miru-alpha -DestinationPath Miru-Alpha-windows.zip

      - name: Upload zip to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Miru-Alpha-windows.zip"
          allowUpdates: true
          prerelease: true

  build-and-release-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Set pubspec version from tag
        run: bash tool/pubspec_from_tag.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "${{env.GO_VERSION}}"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential jq libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build artifacts
        run: flutter build linux --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Rename Release Directory Name to Miru-alpha
        run: mv build/linux/x64/release/bundle build/linux/x64/release/Miru-alpha

      - name: Tar Release
        run: tar -czvf Miru-Alpha-linux.tar.gz -C build/linux/x64/release Miru-alpha

      - name: Upload tar.gz to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Miru-Alpha-linux.tar.gz"
          allowUpdates: true
          prerelease: true
