# git-cliff configuration for miru-alpha
# Release flow: tool/release_prepare.sh (local test / CI prepare step) drives
# this config. The tag pushed by the developer is the source of truth; CI
# regenerates CHANGELOG.md, commits it, and moves the tag onto that commit.
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{%- if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{%- for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{%- endfor %}
{%- endfor %}
"""
trim = true
footer = """
{%- if version and previous.version %}

**Full Changelog**: https://github.com/miru-project/miru-alpha/compare/{{ previous.version }}...{{ version }}
{%- endif %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Other Changes" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^revert", group = "Reverts" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
